name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      # setup-uv v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Verify release version
        run: |
          package=plugins/molecular-modeling-workbench/package.json
          metadata=plugins/molecular-modeling-workbench/plugin-meta.json
          version=$(node -p "require('./$package').version")
          meta_version=$(node -p "require('./$metadata').version")
          test "$version" = "$meta_version"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Run release contracts
        working-directory: plugins/molecular-modeling-workbench
        run: |
          npm run check
          npm test
      - name: Package plugin archive
        run: |
          mkdir -p artifact
          archive="artifact/molecular-modeling-workbench-${GITHUB_REF_NAME}.zip"
          git archive --format=zip \
            --prefix="molecular-modeling-workbench/" \
            --output="$archive" \
            "$GITHUB_SHA" plugins/molecular-modeling-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-ubuntu-22.04
          path: artifact/*.zip

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -name '*.zip' -print0)
          test "${#files[@]}" -gt 0
          tag="$GITHUB_REF_NAME"
          args=(--generate-notes --title "$tag")
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$tag" "${args[@]}" "${files[@]}" \
            || gh release upload "$tag" "${files[@]}" --clobber
