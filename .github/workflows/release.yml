name: AI4S Workbench release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build repository archive
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Verify repository release version
        run: |
          version=$(node -p "require('./package.json').version")
          meta_version=$(node -p "require('./release-meta.json').version")
          test "$version" = "$meta_version"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Run repository release contracts
        run: |
          (
            cd plugins/molecular-modeling-workbench
            npm run check
            npm test
          )
          (
            cd plugins/literature-workbench/source/literature-zotero-mcp
            npm ci
          )
          node plugins/literature-workbench/scripts/assemble-plugin.mjs sync
          node plugins/literature-workbench/scripts/assemble-plugin.mjs check
      - name: Package repository archive
        run: |
          mkdir -p artifact
          archive="artifact/ai4s-workbench-${GITHUB_REF_NAME}.zip"
          git archive --format=zip \
            --prefix="ai4s-workbench/" \
            --output="$archive" \
            "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-ubuntu-22.04
          path: artifact/*.zip

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -name '*.zip' -print0)
          test "${#files[@]}" -gt 0
          tag="$GITHUB_REF_NAME"
          args=(--generate-notes --title "AI4S Workbench $tag")
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$tag" "${args[@]}" "${files[@]}" \
            || gh release upload "$tag" "${files[@]}" --clobber
