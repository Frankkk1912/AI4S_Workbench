name: Literature Workbench CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "plugins/literature-workbench/**"
      - ".github/workflows/literature-workbench-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    name: release-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Verify Zotero MCP
        working-directory: plugins/literature-workbench
        run: |
          cd source/literature-zotero-mcp
          npm ci
          npm test
          npm run typecheck
          npm run lint
      - name: Verify Fulltext MCP
        working-directory: plugins/literature-workbench
        run: |
          cd source/literature-fulltext-mcp
          npm ci
          npm test
          npm run typecheck
      - name: Verify Zotero Desktop add-on
        working-directory: plugins/literature-workbench
        run: |
          cd source/literature-metrics
          npm ci
          npm test
          npm run check
          npm run package
      - name: Verify bundled runtimes and skills
        run: |
          node plugins/literature-workbench/scripts/assemble-plugin.mjs sync
          node plugins/literature-workbench/scripts/assemble-plugin.mjs check
          (
            cd plugins/literature-workbench/runtime
            npm ci
            npm run build
            node ../scripts/verify-runtime.mjs
          )
          (
            cd plugins/literature-workbench/fulltext-runtime
            npm ci
            npm run build
            node ../scripts/verify-fulltext-runtime.mjs
          )
          node --test plugins/literature-workbench/tests/*.test.mjs
          cd plugins/literature-workbench
          uv run -m unittest discover \
            -s skills/literature-research/tests -p 'test_*.py'
          uv run -m unittest discover \
            -s skills/literature-manager/tests -p 'test_*.py'
