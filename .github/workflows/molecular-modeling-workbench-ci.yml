name: Molecular modeling workbench CI

on:
  pull_request:
    paths: ['.github/workflows/molecular-modeling-workbench-ci.yml', 'plugins/molecular-modeling-workbench/**']
  push:
    branches: [main]
    paths: ['.github/workflows/molecular-modeling-workbench-ci.yml', 'plugins/molecular-modeling-workbench/**']

permissions:
  contents: read

jobs:
  cpu-contract:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: plugins/molecular-modeling-workbench
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.16'
          enable-cache: true
      - run: npm run check
      - run: npm test
